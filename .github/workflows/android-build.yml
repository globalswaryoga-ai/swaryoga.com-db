name: Android - Build APK/AAB

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > swar-yoga-release.keystore
        shell: bash

      - name: Build Debug APK (unsigned)
        run: ./gradlew assembleDebug

      - name: Build Release AAB (signed, requires secrets)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: ./gradlew bundleRelease
        env:
          STORE_FILE: swar-yoga-release.keystore
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: swar-yoga-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release AAB
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: swar-yoga-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
