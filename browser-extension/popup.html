<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Swar Yoga WhatsApp CRM</title>
  <style>
    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      color: #111827;
    }
    h1 {
      font-size: 14px;
      font-weight: 700;
      margin: 0 0 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    h1 img { width: 20px; height: 20px; }
    label { display: block; font-size: 11px; font-weight: 600; color: #6b7280; margin: 8px 0 3px; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 9px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 12px;
    }
    button {
      width: 100%;
      margin-top: 12px;
      padding: 8px;
      border: none;
      border-radius: 6px;
      background: #2d6a4f;
      color: #fff;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }
    button:hover { background: #1b4332; }
    button:disabled { opacity: 0.6; cursor: default; }
    .sy-error { color: #b91c1c; font-size: 11px; margin-top: 8px; }
    .sy-status { font-size: 12px; line-height: 1.5; }
    .sy-badge { display: inline-block; padding: 2px 7px; border-radius: 999px; font-size: 10px; font-weight: 700; }
    .sy-ok { background: #dcfce7; color: #166534; }
    .sy-pending { background: #fef3c7; color: #92400e; }
    .sy-logout { background: transparent; color: #b91c1c; border: 1px solid #fecaca; margin-top: 10px; }
    .sy-logout:hover { background: #fef2f2; }
    a { color: #2d6a4f; }
  </style>
</head>
<body>
  <h1><img src="icons/icon32.png" alt="" /> Swar Yoga WhatsApp CRM</h1>

  <div id="loginView">
    <label for="userId">CRM User ID or Email</label>
    <input id="userId" type="text" autocomplete="username" />
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" />
    <button id="loginBtn">Sign in</button>
    <div id="loginError" class="sy-error"></div>
  </div>

  <div id="statusView" style="display:none">
    <div class="sy-status">
      Signed in as <strong id="statusName"></strong><br />
      <span id="statusBadge"></span>
    </div>
    <div id="statusMsg" style="margin-top:8px; font-size:11px; color:#6b7280;"></div>
    <button id="refreshBtn">Refresh access status</button>
    <button id="logoutBtn" class="sy-logout">Sign out</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
