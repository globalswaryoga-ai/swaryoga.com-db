<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="pattern" x="0" y="0" width="400" height="400" patternUnits="userSpaceOnUse">
      <rect width="400" height="400" fill="#f5f5f5"/>
      <!-- Subtle icons pattern -->
      <text x="50" y="50" font-size="20" fill="#d0d0d0" opacity="0.15">🍕</text>
      <text x="150" y="80" font-size="18" fill="#d0d0d0" opacity="0.12">😊</text>
      <text x="250" y="120" font-size="22" fill="#d0d0d0" opacity="0.1">📱</text>
      <text x="100" y="180" font-size="20" fill="#d0d0d0" opacity="0.12">❤️</text>
      <text x="300" y="200" font-size="18" fill="#d0d0d0" opacity="0.15">✈️</text>
      <text x="50" y="280" font-size="21" fill="#d0d0d0" opacity="0.1">🎮</text>
      <text x="200" y="320" font-size="20" fill="#d0d0d0" opacity="0.13">🌙</text>
      <text x="350" y="280" font-size="19" fill="#d0d0d0" opacity="0.11">🎵</text>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#pattern)"/>
</svg>